# Novaryns — app + Postgres + persistent volumes.
# Before first start, create .env with POSTGRES_PASSWORD and SETTINGS_SECRET.
# See DEPLOY.md for the shortest safe commands.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novaryns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-novaryns}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        BUILD_VERSION: ${BUILD_VERSION:-0}
    # Local source builds use novaryns:local. Set APP_IMAGE to this repository's
    # GHCR package when deploying a prebuilt image.
    image: ${APP_IMAGE:-novaryns:local}
    restart: unless-stopped
    # Pass optional model/auth/storage variables from the same deployment file.
    # Explicit values below still win when the database URL or media path must
    # point at Compose services/volumes.
    env_file:
      - .env
    ports:
      # 默认对外 80,浏览器直接 http://<服务器IP> 访问,无需记端口。
      # 若 80 已被占用(如装了宝塔/nginx),设 HTTP_PORT=8080 后重跑即可。
      - "${HTTP_PORT:-80}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-novaryns}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-novaryns}?sslmode=disable
      REFERRAL_REWARD_CREDITS: ${REFERRAL_REWARD_CREDITS:-30}
      # 大陆服务器连不上 api.openai.com 时,设为任意 OpenAI 兼容中转地址即可。
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # AES key for encrypting stored API keys at rest.
      # ⚠️ Set a long random value BEFORE first run and never change it afterwards.
      SETTINGS_SECRET: ${SETTINGS_SECRET:?SETTINGS_SECRET must be set in .env}
      # Local disk media storage (no R2 needed). Mounted as a volume below.
      MEDIA_DIR: /data/media
      # Optional: Pro license (or enter it in the first-run wizard instead)
      # NOVARYNS_EDITION: pro
      # PRO_LICENSE_KEY: NOVA-XXXX-XXXX-XXXX-XXXX
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
